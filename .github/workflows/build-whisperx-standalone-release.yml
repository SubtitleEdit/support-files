name: Build WhisperX standalone release archives

# Produces the three WhisperX standalone archives consumed by SubtitleEdit's
# WhisperDownloadService for the WhisperX speech-to-text engine (SubtitleEdit
# PR #14070): whisperx-standalone-windows-x64.7z, whisperx-standalone-linux-x64.7z
# and whisperx-standalone-macos-arm64.7z.
#
# WhisperX is Python, so the "no Python, no pip" packaging is a PyInstaller
# freeze. The build scripts, pinned requirements and entry point all live in
# the source repo (muaz978/subtitleedit-whisperx-standalone — packaging/);
# this workflow checks that repo out at a pinned ref and runs its scripts,
# so the archives SubtitleEdit downloads are built and published under the
# SubtitleEdit org rather than depending on a personal repo's releases.
# Switch whisperx_repo to a SubtitleEdit fork if upstream ever needs patching.
#
# Archives are .7z, not .zip (the source repo publishes zips): LZMA2 cuts a
# PyInstaller payload roughly a third versus deflate, and SubtitleEdit already
# has the full 7z install path — Purfview Faster-Whisper-XXL (same CT2/torch
# stack, ~1.5 GB) downloads to a file and unpacks via Unpacker.Extract7Zip.
# The pack step compresses a `cp -RL` DEREFERENCED copy of the dist: 7z on
# Unix stores symlinks as links, and SubtitleEdit's managed fallback extractor
# (used e.g. on Macs without a Homebrew 7zz) writes a symlink entry out as an
# ordinary file containing the target path — the same failure class as the
# whisper.cpp Linux zips in issue #13680. Dereferencing matches what the
# source repo's `zip -r` (no -y) produced, so the unpacked layout is identical.
#
# The smoke test transcribes a committed real-speech recording with the exact
# default pipeline (alignment included — a previous --no_align variant of the
# test let an SSL cert bug through because it never exercised the torch.hub
# model-download path) and asserts on the transcribed content, not just a
# clean exit.
#
# WhisperX shells out to a real ffmpeg binary for audio loading — ffmpeg is
# NOT bundled in the standalone build. Subtitle Edit puts its own configured
# ffmpeg on PATH for the process at runtime; the ffmpeg install step here
# exists only so the smoke test can prove that handoff works.
#
# The "Patch entry point" step prepends a small prelude to the source repo's
# whisperx_entry.py (SubtitleEdit issue #15096). A PyInstaller-frozen app runs
# with an isolated interpreter config, so the PYTHONUNBUFFERED / PYTHONUTF8 /
# PYTHONIOENCODING / PYTHONWARNINGS variables Subtitle Edit sets for the
# process are silently ignored: stdout stayed block-buffered when piped (the
# "Transcript: [...]" lines Subtitle Edit turns into progress only arrived
# once transcription was over, so a long CPU run looked hung), and pyannote's
# harmless "torchcodec is not installed correctly" warning - torchcodec is
# excluded from the build on purpose, WhisperX feeds ffmpeg-decoded audio in
# memory - showed up in every log and got blamed for the "hang". The prelude
# does in-process what those variables were meant to do. The streaming smoke
# test below fails the build if either regresses.
#
# The "Migrate the pyannote VAD checkpoint" step (SubtitleEdit issue #15170)
# upgrades whisperx's bundled voice-activity checkpoint in place after the
# build. It was saved with pytorch-lightning 1.5.4, so Lightning 2.x migrates
# it in memory on every launch and prints "Lightning automatically upgraded
# your loaded checkpoint from v1.5.4 to v2.6.6. To apply the upgrade to your
# files permanently, run `python -m lightning.pytorch.utilities.upgrade_checkpoint ...`"
# - a command the user of a frozen build cannot run. The step writes to disk
# exactly what Lightning already builds in memory (state_dict untouched), and
# a re-run of the migration on the result is a no-op, which is Lightning's own
# condition for staying silent. The first smoke test fails if the line is back.
#
# The two "-cuda" matrix entries (SubtitleEdit issue #15206) build the same
# freeze against PyTorch's CUDA 12.8 wheels instead of the CPU-only ones, so
# "--device cuda" works on NVIDIA GPUs. The source repo's build scripts pin the
# CPU wheel index; the "Select the PyTorch wheel index" step rewrites that one
# URL per matrix entry (same approach as the entry-point prelude). cu128 rather
# than cu126 because only cu128 has kernels for the RTX 50 series (sm_120).
# CTranslate2's Windows wheel already has CUDA (a CPU-build run with
# "--device cuda" only failed in torch, #15206); on Linux the CUDA libraries
# come as separate nvidia-* pip packages, so the build step collects them too.
# The runners have no GPU: the CUDA builds run the same CPU smoke tests, plus a
# check that the CUDA libraries were bundled and the archive stays under
# GitHub's 2 GiB release asset limit. A real GPU run has to happen elsewhere.
#
# Dispatch manually with workflow_dispatch. Defaults target v1.0.1 of the
# source repo plus the prelude and the migrated checkpoint (release 103); bump
# whisperx_ref / release_tag for future releases.

on:
  workflow_dispatch:
    inputs:
      whisperx_repo:
        description: 'Source repository (switch to a SubtitleEdit fork here if we ever need to patch it)'
        required: true
        default: 'muaz978/subtitleedit-whisperx-standalone'
      whisperx_ref:
        description: 'Source git ref (tag, branch or commit SHA)'
        required: true
        default: '17a2a8c16bc85797c4742e9b85b81bdb65bc8672'
      release_tag:
        description: 'Tag for the resulting support-files release'
        required: true
        default: 'whisperx-standalone-103'
      release_name:
        description: 'Display name for the release'
        required: true
        default: 'WhisperX standalone v1.0.3'
      publish:
        description: 'Publish the release (off = only upload the archives as workflow artifacts, for test builds)'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-arm64
            torch_index: cpu
          - os: windows-latest
            name: windows-x64
            torch_index: cpu
          - os: ubuntu-latest
            name: linux-x64
            torch_index: cpu
          - os: windows-latest
            name: windows-x64-cuda
            torch_index: cu128
          - os: ubuntu-latest
            name: linux-x64-cuda
            torch_index: cu128

    runs-on: ${{ matrix.os }}

    steps:
      - name: Clone WhisperX standalone source
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.whisperx_repo }}
          ref: ${{ inputs.whisperx_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Patch entry point - line-buffered UTF-8 output, no torchcodec warning
        # See the header note. Prepended (not appended) so it runs before the
        # entry script imports whisperx, which is what triggers the warning.
        working-directory: packaging
        shell: bash
        run: |
          set -euo pipefail
          cat > se_prelude.py <<'EOF'
          # --- Subtitle Edit support-files prelude (SubtitleEdit issue #15096) ---
          # PyInstaller ignores PYTHON* environment variables, so do their job here.
          import sys as _se_sys
          import warnings as _se_warnings

          for _se_stream in (_se_sys.stdout, _se_sys.stderr):
              if _se_stream is not None and hasattr(_se_stream, "reconfigure"):
                  _se_stream.reconfigure(encoding="utf-8", errors="replace", line_buffering=True)

          _se_warnings.filterwarnings(
              "ignore",
              message=r"\s*torchcodec is not installed correctly",
              category=UserWarning,
          )
          # --- end of prelude ---

          EOF
          cat se_prelude.py whisperx_entry.py > whisperx_entry.patched.py
          mv whisperx_entry.patched.py whisperx_entry.py
          rm -f se_prelude.py
          python -m py_compile whisperx_entry.py
          head -20 whisperx_entry.py

      - name: Free disk space (Linux CUDA)
        # The CUDA venv, the dist folder and its dereferenced copy for packing
        # need well over the ~14 GB an ubuntu-latest runner has free.
        if: runner.os == 'Linux' && matrix.torch_index != 'cpu'
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Select the PyTorch wheel index
        # See the header note. Fails if the source repo stopped pinning the CPU
        # index this way, so a CUDA build can never silently ship CPU torch.
        working-directory: packaging
        shell: bash
        run: |
          set -euo pipefail
          for f in build.sh build.ps1; do
            grep -q "https://download.pytorch.org/whl/cpu" "$f"
          done
          if [ "${{ matrix.torch_index }}" != "cpu" ]; then
            sed -i.bak "s#https://download.pytorch.org/whl/cpu#https://download.pytorch.org/whl/${{ matrix.torch_index }}#" build.sh build.ps1
            # Linux CUDA torch loads cuDNN/cuBLAS/... from the nvidia-* pip packages.
            sed -i.bak "s#--collect-all onnxruntime#--collect-all onnxruntime --collect-binaries nvidia#" build.sh
            rm -f build.sh.bak build.ps1.bak
          fi
          grep -n "download.pytorch.org\|collect-binaries" build.sh build.ps1

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        working-directory: packaging
        run: bash build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: packaging
        run: .\build.ps1
        shell: pwsh

      - name: Migrate the pyannote VAD checkpoint - no "Lightning automatically upgraded" line
        # See the header note. Runs with the build venv's interpreter (same torch and
        # lightning the frozen build ships) against the copy PyInstaller placed in the
        # dist folder. Fails if there was nothing to migrate: that means the source repo
        # updated the asset and this step can go.
        working-directory: packaging
        shell: bash
        run: |
          set -euo pipefail
          py="venv/bin/python"
          if [ "${{ runner.os }}" = "Windows" ]; then py="venv/Scripts/python.exe"; fi
          asset="dist/whisperx-standalone/_internal/whisperx/assets/pytorch_model.bin"
          test -f "$asset"
          cat > migrate_vad.py <<'EOF'
          import sys, torch, lightning
          from lightning.pytorch.utilities.migration import migrate_checkpoint, pl_legacy_patch

          path = sys.argv[1]
          print("torch", torch.__version__, "lightning", lightning.__version__)
          with pl_legacy_patch():
              ckpt = torch.load(path, map_location="cpu", weights_only=False)
          state_dict = {k: v.clone() for k, v in ckpt["state_dict"].items()}
          ckpt, applied = migrate_checkpoint(ckpt)
          if not applied:
              sys.exit("nothing to migrate - the bundled checkpoint is already current, drop this step")
          print("applied:", [str(m) for m in applied])
          assert "pyannote.audio" in ckpt, "pyannote specification lost"
          assert ckpt["state_dict"].keys() == state_dict.keys()
          assert all(torch.equal(ckpt["state_dict"][k], state_dict[k]) for k in state_dict)
          torch.save(ckpt, path)

          # Lightning stays silent only when a re-run migrates nothing - prove it.
          with pl_legacy_patch():
              again = torch.load(path, map_location="cpu", weights_only=False)
          _, applied_again = migrate_checkpoint(again)
          if applied_again:
              sys.exit(f"migration is not idempotent: {applied_again}")
          print("migrated", path)
          EOF
          "$py" migrate_vad.py "$asset"

      - name: Check the PyTorch build
        # Runs in the build venv - the frozen app cannot run arbitrary Python. A CUDA
        # entry must have CUDA torch and its libraries in the dist; the arch list shows
        # which GPU generations the build supports.
        working-directory: packaging
        shell: bash
        run: |
          set -euo pipefail
          py="venv/bin/python"
          if [ "${{ runner.os }}" = "Windows" ]; then py="venv/Scripts/python.exe"; fi
          "$py" -c "import torch; print('torch', torch.__version__, 'cuda', torch.version.cuda, 'arch', torch._C._cuda_getArchFlags() if torch.version.cuda else None)"
          if [ "${{ matrix.torch_index }}" = "cpu" ]; then
            "$py" -c "import torch, sys; sys.exit(1 if torch.version.cuda else 0)"
          else
            "$py" -c "import torch, sys; sys.exit(0 if torch.version.cuda else 1)"
            find dist/whisperx-standalone -iname "*cudnn*" -o -iname "*cublas*" | tee cuda-libs.txt
            grep -qi cudnn cuda-libs.txt
            grep -qi cublas cuda-libs.txt
          fi
          du -sh dist/whisperx-standalone
          echo "dereferenced: $(du -shL dist/whisperx-standalone | cut -f1), symlinks: $(find dist/whisperx-standalone -type l | wc -l)"
          # Largest files, for keeping the archives under the release asset limit.
          "$py" -c "import os, sys; r = sys.argv[1]; fs = [(os.path.getsize(os.path.join(d, f)), os.path.join(d, f)) for d, _, n in os.walk(r) for f in n if not os.path.islink(os.path.join(d, f))]; [print(f'{z >> 20:6} MiB  {p}') for z, p in sorted(fs, reverse=True)[:60]]" dist/whisperx-standalone

      - name: Remove the build venv (Linux CUDA)
        # Frees disk for the dereferenced pack copy; nothing below uses the venv.
        if: runner.os == 'Linux' && matrix.torch_index != 'cpu'
        working-directory: packaging
        shell: bash
        run: |
          rm -rf venv build
          df -h /

      - name: Install ffmpeg (smoke test only — see header note)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install ffmpeg
          elif [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          else
            choco install ffmpeg -y
          fi

      - name: Smoke test — transcribe real speech with the default pipeline
        # test-assets/smoke_test.wav is a committed recording ("This is a test
        # of the Whisper X standalone speech to text engine."), so the greps
        # below assert on real transcribed content.
        working-directory: packaging
        shell: bash
        run: |
          set -euo pipefail
          exe="dist/whisperx-standalone/whisperx-standalone"
          if [ "${{ runner.os }}" = "Windows" ]; then exe="dist/whisperx-standalone/whisperx-standalone.exe"; fi
          mkdir -p smoke-out
          "$exe" test-assets/smoke_test.wav --model tiny --device cpu --compute_type int8 --output_dir smoke-out --output_format srt 2>&1 | tee smoke-out/run.log
          cat smoke-out/smoke_test.srt
          grep -qi "whisper" smoke-out/smoke_test.srt
          grep -qi "standalone" smoke-out/smoke_test.srt
          # The default pipeline loads the VAD checkpoint; see the header note.
          if grep -q "Lightning automatically upgraded" smoke-out/run.log; then
            echo "the bundled VAD checkpoint still triggers Lightning's migration message" >&2
            exit 1
          fi

      - name: Smoke test — output streams while transcribing, no torchcodec warning
        # Runs the frozen build the way Subtitle Edit does (stdout/stderr piped)
        # on a ~5 min loop of the test recording with --batch_size 1, so the
        # "Transcript:" lines are produced seconds apart. Block-buffered stdout
        # delivers them in a single burst when transcription ends; the check
        # requires them to be spread out. See the header note.
        working-directory: packaging
        shell: bash
        run: |
          set -euo pipefail
          exe="dist/whisperx-standalone/whisperx-standalone"
          if [ "${{ runner.os }}" = "Windows" ]; then exe="dist/whisperx-standalone/whisperx-standalone.exe"; fi
          ffmpeg -v error -y -stream_loop 80 -i test-assets/smoke_test.wav -ar 16000 -ac 1 smoke-out/long.wav
          cat > stream_check.py <<'EOF'
          import os, subprocess, sys, time

          sys.stdout.reconfigure(errors="replace")
          exe = sys.argv[1]
          cmd = [exe, "smoke-out/long.wav", "--model", "tiny", "--device", "cpu", "--compute_type", "int8",
                 "--language", "en", "--batch_size", "1", "--no_align",
                 "--output_dir", "smoke-out", "--output_format", "srt"]
          p = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          stamps, lines = [], []
          for raw in p.stdout:
              line = raw.decode("utf-8", errors="replace").rstrip()
              lines.append(line)
              print(f"{time.monotonic():10.2f} | {line}", flush=True)
              if line.startswith("Transcript:"):
                  stamps.append(time.monotonic())
          code = p.wait()
          srt = "smoke-out/long.srt"
          if not os.path.isfile(srt) or os.path.getsize(srt) == 0:
              sys.exit(f"no SRT written (exit code {code})")
          if code != 0:
              # Seen once locally on macOS with the 101 build: the native libraries
              # abort during interpreter teardown ("recursive_mutex lock failed"),
              # after the SRT is complete. Rare and unrelated to what this test is
              # about, so flag it without failing a 20 minute build over it.
              print(f"::warning::whisperx exited with {code} after writing its output")
          if any("torchcodec" in l for l in lines):
              sys.exit("torchcodec warning is still printed")
          if len(stamps) < 4:
              sys.exit(f"expected several Transcript lines, got {len(stamps)}")
          spread = stamps[-1] - stamps[0]
          print(f"{len(stamps)} Transcript lines spread over {spread:.2f}s")
          if spread < 1.0:
              sys.exit("Transcript lines arrived in one burst - stdout is still block-buffered")
          EOF
          python stream_check.py "$exe"

      - name: Install 7-Zip (macOS / Linux)
        # Ubuntu's 7zip package names the binary 7z; Homebrew's sevenzip names
        # it 7zz. The pack step resolves whichever exists.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install sevenzip
          else
            sudo apt-get install -y 7zip
          fi
          command -v 7zz || command -v 7z

      - name: Package as 7z (macOS / Linux)
        # cp -RL materializes symlinks as real files before packing — see the
        # header note on the managed-extractor symlink failure class.
        if: runner.os != 'Windows'
        working-directory: packaging/dist
        shell: bash
        run: |
          set -euo pipefail
          cp -RL whisperx-standalone whisperx-standalone-pack
          find whisperx-standalone-pack -type l | tee dangling-links.txt
          test ! -s dangling-links.txt
          sz=$(command -v 7zz || command -v 7z)
          cd whisperx-standalone-pack
          "$sz" a -t7z -mx=9 "../whisperx-standalone-${{ matrix.name }}.7z" .
          "$sz" l "../whisperx-standalone-${{ matrix.name }}.7z" | tail -5
          cd ..
          rm -rf whisperx-standalone-pack

      - name: Package as 7z (Windows)
        if: runner.os == 'Windows'
        working-directory: packaging/dist
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx=9 "whisperx-standalone-${{ matrix.name }}.7z" ".\whisperx-standalone\*"

      - uses: actions/upload-artifact@v4
        with:
          name: whisperx-standalone-${{ matrix.name }}
          path: packaging/dist/whisperx-standalone-${{ matrix.name }}.7z
          if-no-files-found: error

      - name: Check archive size
        # GitHub refuses release assets of 2 GiB or more. After the upload, so an
        # oversized archive can still be downloaded and inspected.
        working-directory: packaging/dist
        shell: bash
        run: |
          set -euo pipefail
          f="whisperx-standalone-${{ matrix.name }}.7z"
          size=$(wc -c < "$f")
          echo "$f: $((size / 1048576)) MiB"
          test "$size" -lt 2147483648

  # --------------------------------------------------------------------
  # Collect the five archives and publish them as a single release.
  # The first run for a given tag creates the release; reruns update it.
  # --------------------------------------------------------------------
  release:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show staged archives
        run: ls -la artifacts/*/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            artifacts/whisperx-standalone-macos-arm64/whisperx-standalone-macos-arm64.7z
            artifacts/whisperx-standalone-windows-x64/whisperx-standalone-windows-x64.7z
            artifacts/whisperx-standalone-linux-x64/whisperx-standalone-linux-x64.7z
            artifacts/whisperx-standalone-windows-x64-cuda/whisperx-standalone-windows-x64-cuda.7z
            artifacts/whisperx-standalone-linux-x64-cuda/whisperx-standalone-linux-x64-cuda.7z
